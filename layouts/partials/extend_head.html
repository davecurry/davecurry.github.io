<!-- Sidebar collapsed state, read synchronously so the sidebar never
     flashes expanded-then-collapsed on load. Mirrors the theme's own
     pref-theme script above. -->
<script>
    if (localStorage.getItem('sidebar-collapsed') === '1') {
        document.documentElement.classList.add('sidebar-collapsed');
    }
</script>
