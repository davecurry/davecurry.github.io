# adding some space

baseURL: "https://davecurry.net/"
languageCode: en-us
title: davecurry.net
pagination:
    pagerSize: 10
theme: PaperMod

# relativeURLs: true
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

minify:
    disableXML: true
    # minifyOutput: true

taxonomies:
    category: categories
    tag: tags
    series: series

markup:
    goldmark:
        renderer:
            unsafe: true

menu:
    main:
        - name: Blog
          url: /
          weight: -1
        - name: Projects
          identifier: pages/projects
          url: pages/projects
          weight: 1
          pre: '<span class="material-symbols-outlined" style="font-size:1rem;vertical-align:-0.15em;margin-right:0.25em;">auto_awesome</span>'
        - name: Reading
          url: pages/reading
          weight: 2
          pre: '<span class="material-symbols-outlined" style="font-size:1rem;vertical-align:-0.15em;margin-right:0.25em;">book</span>'
        - name: Who Me?
          url: pages/about
          weight: 3

params:
    defaultTheme: dark
    disableThemeToggle: true
    disableScrollToTop: true
    ShowShareButtons: false
    ShowReadingTime: true
    # disableSpecial1stPost: true
    displayFullLangName: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: true
    ShowToc: false
    favicon: "favicon.ico"
    comments: false
    # images: ["papermod-cover.png"]
    cover:
        hiddenInList: false     # show cover in list/preview views
        hiddenInSingle: true   # show cover on the post page itself

    mainSections:
    - posts

    homeInfoParams:
        Title: "Dave Curry"
        Content: |
          ## Dave is a design leader for [HBO Max](/hbomax.jpg) at Warner Bros. Discovery ##

          - Previously WarnerMedia, HBO, and #AgencyLife

    socialIcons: # optional
        - name: "LinkedIn"
          url: "http://linkedin.com/in/davecurry"

    # Sidebar "Now" block — hand-edited, shown in layouts/partials/header.html
    now:
        watching:
            label: "Currently watching"
            title: "Euphoria"
            meta: "Season 3"
            poster: "https://media.themoviedb.org/t/p/w185/ypmtwojDd751Peszi62DVLytqqC.jpg"
            url: "https://www.themoviedb.org/tv/85552-euphoria/season/3"
        lastMovie:
            label: "Last movie watched"
            title: "Leave Her to Heaven"
            meta: "1945"
            poster: "https://media.themoviedb.org/t/p/w185/aUzQZt2UlaurZ3wlhzVXQb6PQk8.jpg"
            url: "https://www.themoviedb.org/movie/17645-leave-her-to-heaven"

