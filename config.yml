# adding some space

baseURL: "https://davecurry.net/"
languageCode: en-us
title: davecurry.net
pagination:
    pagerSize: 10
theme: PaperMod

# relativeURLs: true
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

minify:
    disableXML: true
    # minifyOutput: true

taxonomies:
    category: categories
    tag: tags
    series: series

markup:
    goldmark:
        renderer:
            unsafe: true

menu:
    main:
        - name: Feed
          url: /
          weight: -1
        - name: Projects
          identifier: pages/projects
          url: pages/projects
          weight: 1
          pre: '<span class="material-symbols-outlined" style="font-size:1rem;vertical-align:-0.15em;margin-right:0.25em;">auto_awesome</span>'
        - name: Reading
          url: pages/reading
          weight: 2
          pre: '<span class="material-symbols-outlined" style="font-size:1rem;vertical-align:-0.15em;margin-right:0.25em;">book</span>'
        - name: Who Me?
          url: pages/about
          weight: 3

params:
    defaultTheme: dark
    disableThemeToggle: true
    disableScrollToTop: true
    ShowShareButtons: false
    ShowReadingTime: true
    # disableSpecial1stPost: true
    displayFullLangName: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: true
    ShowToc: false
    favicon: "favicon.ico"
    comments: false
    # images: ["papermod-cover.png"]
    cover:
        hiddenInList: false     # show cover in list/preview views
        hiddenInSingle: true   # show cover on the post page itself

    mainSections:
    - posts

    homeInfoParams:
        Title: "Dave Curry"
        Content: |
          ## Dave is a design leader for [HBO Max](/hbomax.jpg) at Warner Bros. Discovery ##

          - Previously WarnerMedia, HBO, and #AgencyLife

    socialIcons: # optional
        - name: "LinkedIn"
          url: "http://linkedin.com/in/davecurry"

    # Sidebar "Soundtrack", read live from Last.fm in the browser. The API key
    # is a public, read-only key (it's meant to ship in client code); the block
    # stays hidden until one is set. Create one at last.fm/api/account/create.
    lastfm:
        user: "davecurry"
        apiKey: "dd4155bfe31c62a7eacf80c27c927a41"

    # Sidebar "Now" block — hand-edited, shown in layouts/partials/header.html.
    # A single poster stack: the first item is on top, and clicking the stack
    # cycles through the rest. Keep what you're still watching at the top.
    now:
        label: "Screen Time"
        items:
            - title: "You Can See Everything"
              meta: "2026"
              poster: "https://media.themoviedb.org/t/p/w185/Ap8QwmKfSjYbWC4XIP8w9pdn72O.jpg"
              url: "https://www.themoviedb.org/movie/1765072-you-can-see-everything"
            - title: "Youth"
              meta: "Season One"
              poster: "https://media.themoviedb.org/t/p/w185/zKaTNcWmP2dxYnxmOAVhBvSqNy9.jpg"
              url: "https://play.hbomax.com/show/e8d516df-be68-42a3-8180-82a4b56ff589"
            - title: "Girls"
              meta: "Season One"
              poster: "https://media.themoviedb.org/t/p/w185/f9E5kiEzjz6pmNYOoxUnPzionfb.jpg"
              url: "https://www.themoviedb.org/tv/42282-girls/season/1"
            - title: "Norm: The Tale of Norm Macdonald"
              meta: "2026"
              poster: "https://media.themoviedb.org/t/p/w185/sQw3m4hl1xyoT9zr7shnNCHDKI3.jpg"
              url: "https://www.themoviedb.org/movie/1620918-norm-the-tale-of-norm-macdonald"
            - title: "JAŸ-Z in 8"
              meta: "Season One"
              poster: "https://media.themoviedb.org/t/p/w185/ncwa0H2NxO64sHnY3Xda0pWtdcl.jpg"
